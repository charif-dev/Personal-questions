}
function toast(msg){var el=document.getElementById("toast");el.textContent=msg;el.classList.add("on");setTimeout(function(){el.classList.remove("on")},1800)}
function download(){
var pre=document.getElementById("preset");
pre.textContent=JSON.stringify({s:enc(),d:lockDate,n:name,l:lang}).replace(/</g,"\\u003c");
var html="<!doctype html>\n"+document.documentElement.outerHTML;
pre.textContent="null";
var blob=new Blob([html],{type:"text/html;charset=utf-8"});
var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ficha-preferencias-"+lockDate+".html";
document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
}
app.addEventListener("click",function(e){
var b=e.target.closest("button");if(!b)return;
if(b.hasAttribute("data-k")){
if(lockDate)return;
var k=b.getAttribute("data-k"),v=+b.getAttribute("data-v");
if(ans[k]===v)delete ans[k];else ans[k]=v;
Array.prototype.forEach.call(document.querySelectorAll('button[data-k="'+k+'"]'),function(o){o.setAttribute("aria-pressed",String(ans[k]===+o.getAttribute("data-v")))});
saveDraft();updateProg();return}
var act=b.getAttribute("data-act");
if(act==="lang"){lang=b.getAttribute("data-l");if(lockDate&&!preset)setHash();saveDraft();render()}
else if(act==="clear"){if(confirm(t("clearQ"))){ans={};name="";saveDraft();render()}}
else if(act==="save"){if(confirm(t("saveQ"))){lockDate=today();setHash();try{localStorage.removeItem(DRAFT)}catch(err){}render();window.scrollTo(0,0)}}
else if(act==="copy"){var u=location.href;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(function(){toast(t("copied"))},function(){prompt(t("copy"),u)})}else prompt(t("copy"),u)}
else if(act==="dl")download();
else if(act==="print")window.print();
else if(act==="fresh"){location.href=location.href.split("#")[0]}
});
app.addEventListener("input",function(e){if(e.target.id==="nm"){name=e.target.value;saveDraft()}});
load();render();
})();
</script>
</body>
</html>
