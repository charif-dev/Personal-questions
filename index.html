:root{--bg:#E8EBF0;--paper:#FFFFFF;--ink:#1C2230;--muted:#646B7E;--line:#D5DAE3;--soft:#F3F5F8;--fav:#2D5FB4;--gos:#2C8453;--cur:#B7860F;--nao:#A3313A;color-scheme:light dark}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.langsel{flex:none;margin-top:10px}
.langsel select{font:600 .9rem/1.2 inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer}
.intro,.note{color:var(--muted);max-width:62ch;margin:0 0 12px}

.user label.cs{display:flex;gap:10px;align-items:flex-start;margin-top:12px;color:var(--ink)}
.user label.cs input{width:20px;height:20px;margin-top:2px;flex:none}
.prog{color:var(--muted);font-size:.9rem;margin:10px 0 0}
.stamp{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--ink);border-radius:10px;padding:12px 14px;margin:6px 0 4px}
.stamp b{display:block;font-size:1.05rem}
.stamp span{color:var(--muted);display:block}
.mailst{margin:8px 0 0;font-weight:600}
.mailst.failed{color:var(--nao)}.mailst.sent{color:var(--gos)}
section{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin:18px 0;padding:4px 16px 6px}
section h2{font-size:1.3rem;letter-spacing:-.01em;margin:14px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
section h2 small{color:var(--muted);font-weight:500;font-size:.85rem;white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.lab{flex:1 1 210px;min-width:0}
.lab .d{display:block;color:var(--muted);font-size:.86rem;line-height:1.35}
.groups{display:flex;gap:16px;flex-wrap:wrap}
.grp{display:flex;flex-direction:column;gap:4px}
.grp small{font-size:.76rem;color:var(--muted);font-weight:600}
.seg{display:flex;gap:5px}
.seg button{width:38px;height:38px;border-radius:9px;border:1.5px solid var(--line);background:var(--soft);color:var(--muted);font:600 .95rem/1 inherit;cursor:pointer;padding:0}
.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.seg button.l1[aria-pressed="true"]{background:var(--fav);border-color:var(--fav);color:#fff}
.seg button.l2[aria-pressed="true"]{background:var(--gos);border-color:var(--gos);color:#fff}
.seg button.l3[aria-pressed="true"]{background:var(--cur);border-color:var(--cur);color:#fff}
.seg button.l4[aria-pressed="true"]{background:var(--nao);border-color:var(--nao);color:#fff}
body.locked .seg button{cursor:default}
body.locked .seg button[aria-pressed="false"]{opacity:.25}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.bar .in{max-width:780px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{font:600 .95rem/1 inherit;border-radius:10px;padding:12px 16px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media print{.bar,.langsel,.toast{display:none}body{background:#fff;color:#000}section{break-inside:avoid-page}.wrap{padding-bottom:0}}
</style>

function applyState(p){if(!dec(p.s||""))return false;lockDate=p.d||today();name=p.n||"";if(okLang(p.l))lang=p.l;return true}
function load(){
try{var p=JSON.parse(document.getElementById("preset").textContent);if(p&&p.s&&applyState(p)){preset=p;return}}catch(e){}
var h=new URLSearchParams(location.hash.slice(1));
if(h.get("s")&&applyState({s:h.get("s"),d:h.get("d"),n:h.get("n"),l:h.get("l")}))return;
try{var d=JSON.parse(localStorage.getItem(DRAFT)||"null");if(d){ans=d.a||{};name=d.n||"";if(okLang(d.l))lang=d.l}}catch(e){}
}
function saveDraft(){if(lockDate)return;try{localStorage.setItem(DRAFT,JSON.stringify({a:ans,n:name,l:lang}))}catch(e){}}
function setHash(){var p=new URLSearchParams();p.set("s",enc());p.set("d",lockDate);if(name)p.set("n",name);p.set("l",lang);try{history.replaceState(null,"","#"+p.toString())}catch(e){location.hash=p.toString()}}
function count(prefix){var a=0,n=0;KEYS.forEach(function(k){if(prefix===null||k.indexOf(prefix)===0){n++;if(ans[k])a++}});return[a,n]}
function summary(){
var out=[];
S.forEach(function(s,si){
var lines=[];
s.i.forEach(function(it,ii){
var n=s.c?s.c.length:1,parts=[];
for(var c=0;c<n;c++){var v=ans[si+"-"+ii+"-"+c];if(v)parts.push((s.c?L(s.c[c])+": ":"")+LV[v][lang][1])}
if(parts.length)lines.push("- "+lab(it)+" | "+parts.join(" / "))});
if(lines.length)out.push(L(s.t).toUpperCase()+"\n"+lines.join("\n"))});
return out.join("\n\n")||t("none");
}
function mailHTML(){
if(!mail)return"";
var cls=mail==="sent"?"sent":mail==="failed"?"failed":"";
var txt=mail==="sent"?t("sent"):mail==="failed"?t("failed")+(mailMsg?" ("+mailMsg+")":""):t("sending");
return'<p class="mailst '+cls+'" id="mailst">'+esc(txt)+'</p>';
}
function withTimeout(p,ms){return new Promise(function(res,rej){var id=setTimeout(function(){rej(new Error("timeout"))},ms);p.then(function(v){clearTimeout(id);res(v)},function(e){clearTimeout(id);rej(e)})})}function send(){
mail="sending";mailMsg="";render();
var subj=t("subject",{n:name}),req;
if(W3KEY){
req=fetch("https://api.web3forms.com/submit",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({access_key:W3KEY,subject:subj,from_name:name,Name:name,Date:lockDate,Language:lang,Link:location.href,message:summary()})});
}else{
req=fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({_subject:subj,_template:"box",_captcha:"false",Name:name,Date:lockDate,Language:lang,Link:location.href,Answers:summary()})});
}
req=withTimeout(req,15000);req.then(function(r){return r.json().catch(function(){return{}}).then(function(j){return{ok:r.ok,st:r.status,j:j}})})
.then(function(res){if(res.ok&&res.j&&String(res.j.success)==="true"){mail="sent"}else{mail="failed";mailMsg=(res.j&&res.j.message)||("HTTP "+res.st)}})
.catch(function(e){mail="failed";mailMsg=String(e&&e.message||e)})
.then(render);
}
function render(){
document.documentElement.lang=lang==="pt"?"pt-PT":lang;
document.title=t("title");
document.body.classList.toggle("locked",!!lockDate);
var h='<div class="wrap"><div class="top"><h1>'+t("title")+'</h1><label class="langsel"><span class="sr" style="position:absolute;left:-9999px">'+t("lang")+'</span><select id="lang" aria-label="'+t("lang")+'">';
LANGS.forEach(function(l){h+='<option value="'+l[0]+'"'+(l[0]===lang?" selected":"")+'>'+l[1]+'</option>'});
h+='</select></label></div>';
if(lockDate)h+='<div class="stamp"><b>'+esc(t("locked",{d:lockDate}))+'</b>'+(name?'<span>'+esc(t("by",{n:name}))+'</span>':'')+mailHTML()+'</div>';
else h+='<p class="intro">'+t("intro")+'</p>';
h+='<h2 class="lt">'+t("legend")+'</h2><div class="legend">';
[1,2,3,4].forEach(function(v){var l=LV[v][lang];h+='<div class="lg"><span class="dot l'+v+'" aria-hidden="true">'+l[0]+'</span><div><b>'+esc(l[1])+'</b><span class="t">'+esc(l[2])+'</span></div></div>'});
h+='<div class="lg"><span class="dot l0" aria-hidden="true"></span><div><b>'+t("none")+'</b><span class="t">'+t("noneD")+'</span></div></div></div>';
h+='<p class="note">'+t("cols")+'</p>';
if(!lockDate)h+='<div class="user"><label class="nm"><span>'+t("name")+'</span><input type="text" id="nm" maxlength="40" autocomplete="off" required value="'+esc(name)+'"></label>'+
'<label class="cs"><input type="checkbox" id="cs"'+(consent?" checked":"")+'><span>'+esc(t("consent"))+'</span></label></div>';
h+='<p class="prog" id="prog"></p>';
S.forEach(function(s,si){
var n=s.c?s.c.length:1;
h+='<section><h2>'+esc(L(s.t))+'<small data-sec="'+si+'"></small></h2>';
s.i.forEach(function(it,ii){
var lb=lab(it),d=desc(it);
h+='<div class="row"><div class="lab">'+esc(lb)+(d?'<span class="d">'+esc(d)+'</span>':'')+'</div><div class="groups">';
for(var c=0;c<n;c++){
var k=si+"-"+ii+"-"+c,cn=s.c?L(s.c[c]):"";
h+='<div class="grp">'+(s.c?'<small>'+esc(cn)+'</small>':'')+'<div class="seg">';
[1,2,3,4].forEach(function(v){var l=LV[v][lang];
h+='<button type="button" class="l'+v+'" data-k="'+k+'" data-v="'+v+'" aria-pressed="'+(ans[k]===v)+'" aria-label="'+esc(lb+(cn?", "+cn:"")+": "+l[1])+'"'+(lockDate?' disabled':'')+'>'+l[0]+'</button>'});
h+='</div></div>'}
h+='</div></div>'});
h+='</section>'});
h+='</div><div class="bar"><div class="in">';
if(!lockDate)h+='<button type="button" class="btn" data-act="clear">'+t("clear")+'</button><button type="button" class="btn primary" data-act="save">'+t("save")+'</button>';
else{
if(mail==="failed")h+='<button type="button" class="btn primary" data-act="resend">'+t("resend")+'</button>';
if(!preset&&mail!=="sent")h+='<button type="button" class="btn" data-act="mailapp">'+t("mailapp")+'</button>';
if(!preset)h+='<button type="button" class="btn" data-act="copy">'+t("copy")+'</button>';
h+='<button type="button" class="btn" data-act="dl">'+t("dl")+'</button><button type="button" class="btn" data-act="print">'+t("print")+'</button>';
if(!preset)h+='<button type="button" class="btn" data-act="fresh">'+t("fresh")+'</button>'}
h+='</div></div>';
app.innerHTML=h;
updateProg();
}
function updateProg(){
var c=count(null);var el=document.getElementById("prog");if(el)el.textContent=t("prog",{a:c[0],t:c[1]});
Array.prototype.forEach.call(document.querySelectorAll("[data-sec]"),function(e){var r=count(e.getAttribute("data-sec")+"-");e.textContent=t("sec",{a:r[0],t:r[1]})});
}
function toast(msg){var el=document.getElementById("toast");el.textContent=msg;el.classList.add("on");setTimeout(function(){el.classList.remove("on")},2200)}
function download(){
var pre=document.getElementById("preset");
pre.textContent=JSON.stringify({s:enc(),d:lockDate,n:name,l:lang}).replace(/</g,"\\u003c");
var keep=mail;mail=null;render();
var html="<!doctype html>\n"+document.documentElement.outerHTML;
pre.textContent="null";mail=keep;render();
var blob=new Blob([html],{type:"text/html;charset=utf-8"});
var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ficha-preferencias-"+lockDate+".html";
document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
}
app.addEventListener("click",function(e){
var b=e.target.closest("button");if(!b)return;
if(b.hasAttribute("data-k")){
if(lockDate)return;
var k=b.getAttribute("data-k"),v=+b.getAttribute("data-v");
if(ans[k]===v)delete ans[k];else ans[k]=v;
Array.prototype.forEach.call(document.querySelectorAll('button[data-k="'+k+'"]'),function(o){o.setAttribute("aria-pressed",String(ans[k]===+o.getAttribute("data-v")))});
saveDraft();updateProg();return}
var act=b.getAttribute("data-act");
if(act==="clear"){if(confirm(t("clearQ"))){ans={};name="";consent=false;saveDraft();render()}}
else if(act==="save"){
name=name.trim();
if(!name){toast(t("nameReq"));var n=document.getElementById("nm");if(n){n.focus();n.scrollIntoView({block:"center"})}return}
if(!consent){toast(t("consentReq"));var c=document.getElementById("cs");if(c){c.focus();c.scrollIntoView({block:"center"})}return}
if(confirm(t("saveQ"))){lockDate=today();setHash();try{localStorage.removeItem(DRAFT)}catch(err){}window.scrollTo(0,0);send()}}
else if(act==="mailapp"){var mb=name+"\n"+lockDate+"\n\n"+location.href;location.href="mailto:"+MAIL+"?subject="+encodeURIComponent(t("subject",{n:name}))+"&body="+encodeURIComponent(mb)}
else if(act==="resend")send();
else if(act==="copy"){var u=location.href;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(function(){toast(t("copied"))},function(){prompt(t("copy"),u)})}else prompt(t("copy"),u)}
else if(act==="dl")download();
else if(act==="print")window.print();
else if(act==="fresh"){location.href=location.href.split("#")[0]}
});
app.addEventListener("change",function(e){
if(e.target.id==="lang"){lang=e.target.value;if(lockDate&&!preset)setHash();saveDraft();render()}
else if(e.target.id==="cs"){consent=e.target.checked}
});
app.addEventListener("input",function(e){if(e.target.id==="nm"){name=e.target.value;saveDraft()}});
load();render();
})();
</script>
</body>
</html>
